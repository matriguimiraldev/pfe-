<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voice Demo</title>
  <style>
    :root {
      --bg-0: #0a0617;
      --bg-1: #140a2e;
      --bg-2: #24114c;
      --card: rgba(25, 15, 48, 0.78);
      --card-border: rgba(188, 153, 255, 0.28);
      --text: #f4edff;
      --muted: #c5b3ea;
      --accent: #b678ff;
      --accent-2: #7b5cff;
      --ok: #6effc5;
      --err: #ff8fb3;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Trebuchet MS", "Segoe UI", Tahoma, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 650px at 8% -10%, #3d1a80 0%, transparent 60%),
        radial-gradient(900px 500px at 100% 10%, #2f1672 0%, transparent 62%),
        linear-gradient(160deg, var(--bg-0), var(--bg-1) 45%, var(--bg-2));
      min-height: 100vh;
    }

    .wrap {
      max-width: 980px;
      margin: 36px auto;
      padding: 0 16px 36px;
    }

    .panel {
      border: 1px solid var(--card-border);
      background: var(--card);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 22px 48px rgba(0, 0, 0, 0.45);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.4rem, 3.4vw, 2.1rem);
      letter-spacing: 0.2px;
    }

    p {
      margin: 0;
      color: var(--muted);
    }

    .stage {
      margin-top: 18px;
      display: grid;
      gap: 14px;
    }

    .mic-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 0.98rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      cursor: pointer;
      transition: transform 120ms ease, filter 120ms ease, opacity 120ms ease;
    }

    button:hover { transform: translateY(-1px); filter: brightness(1.08); }
    button:disabled { opacity: 0.55; cursor: wait; transform: none; }

    .ghost {
      background: transparent;
      border: 1px solid rgba(182, 120, 255, 0.55);
      color: #eedcff;
    }

    .box {
      border: 1px solid rgba(188, 153, 255, 0.3);
      border-radius: 14px;
      background: rgba(13, 8, 27, 0.72);
      padding: 12px;
    }

    .label {
      font-weight: 700;
      margin-bottom: 8px;
      color: #efe5ff;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      border: 0;
      outline: none;
      border-radius: 10px;
      background: #120b24;
      color: #f8f3ff;
      padding: 10px;
      font-size: 0.98rem;
    }

    .status { font-weight: 700; min-height: 24px; }
    .ok { color: var(--ok); }
    .error { color: var(--err); }

    audio {
      width: min(460px, 100%);
      filter: hue-rotate(230deg) saturate(1.15);
    }

    .pulse {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.92rem;
      color: #dac4ff;
      visibility: hidden;
    }

    .pulse.on { visibility: visible; }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ff4fa5;
      box-shadow: 0 0 0 0 rgba(255, 79, 165, 0.8);
      animation: ping 1.2s infinite;
    }

    @keyframes ping {
      0% { box-shadow: 0 0 0 0 rgba(255, 79, 165, 0.8); }
      70% { box-shadow: 0 0 0 12px rgba(255, 79, 165, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 79, 165, 0); }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="panel">
      <h1>Demo Vocal Direct</h1>
      <p>Parle au micro, stoppe, puis reçois directement le texte et la réponse audio.</p>

      <div class="stage">
        <div class="mic-row">
          <button id="btnMicStart">Demarrer Micro</button>
          <button id="btnMicStop" class="ghost" disabled>Stop + Envoyer</button>
          <span id="livePulse" class="pulse"><span class="dot"></span> Enregistrement...</span>
        </div>

        <div id="status" class="status"></div>
        <audio id="audioPlayer" controls></audio>

        <div class="box">
          <div class="label">Transcription</div>
          <textarea id="transcriptText" placeholder="La transcription apparait ici..."></textarea>
        </div>

        <div class="box">
          <div class="label">Reponse Assistant</div>
          <textarea id="answerText" placeholder="La reponse LLM apparait ici..."></textarea>
        </div>
      </div>
    </section>
  </main>

  <script>
    const transcriptText = document.getElementById("transcriptText");
    const answerText = document.getElementById("answerText");
    const statusEl = document.getElementById("status");
    const player = document.getElementById("audioPlayer");
    const btnMicStart = document.getElementById("btnMicStart");
    const btnMicStop = document.getElementById("btnMicStop");
    const livePulse = document.getElementById("livePulse");

    let mediaRecorder = null;
    let mediaStream = null;
    let recordedChunks = [];

    function setStatus(message, ok = true) {
      statusEl.className = ok ? "status ok" : "status error";
      statusEl.textContent = message;
    }

    function setBusy(busy) {
      if (busy) {
        btnMicStart.disabled = true;
        btnMicStop.disabled = true;
      } else {
        btnMicStart.disabled = false;
        btnMicStop.disabled = mediaRecorder?.state !== "recording";
      }
    }

    async function runAskPipeline(blob) {
      const formData = new FormData();
      formData.append("file", blob, "mic-recording.webm");

      const res = await fetch("/voice/ask", { method: "POST", body: formData });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(data.detail || "Erreur pendant /voice/ask");
      }

      transcriptText.value = data.transcript || "";
      answerText.value = data.answer || "";
      if (data.audio_base64) {
        player.src = `data:${data.audio_mime_type || "audio/wav"};base64,${data.audio_base64}`;
        player.play().catch(() => {});
      }
    }

    btnMicStart.addEventListener("click", async () => {
      try {
        recordedChunks = [];
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(mediaStream);

        mediaRecorder.ondataavailable = (event) => {
          if (event.data && event.data.size > 0) recordedChunks.push(event.data);
        };

        mediaRecorder.start();
        btnMicStart.disabled = true;
        btnMicStop.disabled = false;
        livePulse.classList.add("on");
        setStatus("Micro actif. Parle puis clique sur Stop + Envoyer.");
      } catch (err) {
        setStatus("Acces micro refuse ou indisponible: " + err.message, false);
      }
    });

    btnMicStop.addEventListener("click", async () => {
      try {
        if (!mediaRecorder || mediaRecorder.state !== "recording") {
          throw new Error("Le micro n'est pas en enregistrement.");
        }
        btnMicStop.disabled = true;
        setStatus("Traitement en cours...");

        const stopped = new Promise((resolve) => {
          mediaRecorder.onstop = resolve;
        });
        mediaRecorder.stop();
        await stopped;

        const recordedBlob = new Blob(recordedChunks, { type: "audio/webm" });
        if (!recordedBlob.size) {
          throw new Error("Audio vide. Reessaie avec un enregistrement plus long.");
        }

        if (mediaStream) mediaStream.getTracks().forEach((t) => t.stop());
        mediaStream = null;
        livePulse.classList.remove("on");

        setBusy(true);
        await runAskPipeline(recordedBlob);
        setStatus("Reponse recue et audio joue.");
      } catch (err) {
        setStatus(err.message, false);
      } finally {
        setBusy(false);
        livePulse.classList.remove("on");
        if (mediaStream) {
          mediaStream.getTracks().forEach((t) => t.stop());
          mediaStream = null;
        }
      }
    });
  </script>
</body>
</html>
